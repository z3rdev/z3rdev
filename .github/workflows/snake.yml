name: Gerar cobrinha

on:
  # roda todo dia à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"
  # permite rodar na mão pela aba Actions
  workflow_dispatch:
  # roda sempre que o README for atualizado
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7aa2f7
            dist/snake-dark.svg?palette=github-dark&color_snake=#7aa2f7

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
